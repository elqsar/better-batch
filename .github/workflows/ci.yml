name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # Unix only: the directory lock is flock, and without it the
        # single-writer guarantee the buffer relies on does not hold.
        os: [ubuntu-latest, macos-latest]
        # The oldest version go.mod admits, and the newest release: stable
        # alone would never exercise the minimum the module promises.
        go: ['1.26.x', 'stable']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}

      - name: Verify formatting
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Test with race detector
        run: go test -race ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      # Pinned, so a run can be reproduced and a new release of either tool
      # arrives as a reviewed change here rather than silently. Kept out of
      # go.mod on purpose: the module has no dependencies, and a tool
      # directive would give it some.
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 ./...

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      # The seed corpora already run as ordinary tests above; this spends a
      # little time looking for inputs nobody wrote down. Recovery parses bytes
      # off the disk, so it is where an unexpected input costs the most.
      - name: Fuzz the segment scanner
        run: go test -run '^$' -fuzz '^FuzzScanSegment$' -fuzztime 30s ./internal/wal

      - name: Fuzz recovery
        run: go test -run '^$' -fuzz '^FuzzRecover$' -fuzztime 30s ./internal/wal

  clickhouse:
    runs-on: ubuntu-latest
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:25.8
        env:
          CLICKHOUSE_USER: test
          CLICKHOUSE_PASSWORD: test
        ports:
          - 9000:9000
        options: >-
          --health-cmd "clickhouse-client -u test --password test -q 'SELECT 1'"
          --health-interval 2s --health-timeout 5s --health-retries 30
    defaults:
      run:
        working-directory: clickhouse
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: clickhouse/go.sum

      # The connector's go.mod names a published core release; this is what a
      # caller running go get resolves, so it has to build on its own.
      - name: Build against the published core
        env:
          GOWORK: 'off'
        run: go build ./...

      # From here on, against the core in this checkout, so a core change that
      # breaks the connector fails the pull request that makes it.
      - name: Join the modules
        run: go work init .. .

      - name: Verify formatting
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet -tags integration ./...

      - name: Test, integration included
        run: go test -race -tags integration ./...

      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 ./...

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
